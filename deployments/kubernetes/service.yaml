apiVersion: v1
kind: Namespace
metadata:
  name: nac
---
apiVersion: v1
kind: Service
metadata:
  name: nacd
  namespace: nac
  labels:
    app.kubernetes.io/name: nacd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nacd
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nacd
  namespace: nac
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nacd
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nacd
  namespace: nac
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nacd
