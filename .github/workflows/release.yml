name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Gate the release on a fresh vulnerability scan of the exact tagged code.
  vuln-gate:
    name: Vulnerability gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  reproducible-build:
    name: Reproducible binary + SBOM
    needs: [vuln-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # keyless signing / provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build twice and verify reproducibility
        id: build
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA::12}"
          # Pin the build timestamp to the commit for deterministic output.
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          BUILD_DATE="$(date -u -d "@${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w \
            -X github.com/kidcarmi/nac/pkg/version.Version=${VERSION} \
            -X github.com/kidcarmi/nac/pkg/version.Commit=${COMMIT} \
            -X github.com/kidcarmi/nac/pkg/version.BuildDate=${BUILD_DATE}"
          build() { CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOFLAGS=-trimpath \
            go build -ldflags "$LDFLAGS" -o "$1" ./cmd/nacd; }
          build nacd-1
          build nacd-2
          a="$(sha256sum nacd-1 | awk '{print $1}')"
          b="$(sha256sum nacd-2 | awk '{print $1}')"
          echo "build 1: $a"
          echo "build 2: $b"
          [ "$a" = "$b" ] || { echo "::error::non-reproducible build"; exit 1; }
          cp nacd-1 nacd
          sha256sum nacd > nacd.sha256
          echo "digest=$a" >> "$GITHUB_OUTPUT"

      - name: Generate source SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: nacd.spdx.json

      - name: Attest binary provenance (SLSA)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: nacd

      - name: Attest binary SBOM
        uses: actions/attest-sbom@v1
        with:
          subject-path: nacd
          sbom-path: nacd.spdx.json

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nacd-binary
          path: |
            nacd
            nacd.sha256
            nacd.spdx.json

  release-image:
    name: Signed image + provenance
    needs: [vuln-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write        # cosign keyless + attestations
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate image SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: image.spdx.json

      - name: Attest image SBOM
        uses: actions/attest-sbom@v1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: image.spdx.json
          push-to-registry: true

      - name: Attest image provenance (SLSA)
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
