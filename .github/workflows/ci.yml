name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  MIN_COVERAGE: "60"

jobs:
  verify:
    name: Lint, vet, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify tidy & formatting
        run: make check
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.5.0

  test:
    name: Unit tests + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run unit tests with race detector
        run: go test -race -coverprofile=coverage.out ./...
      - name: Enforce coverage threshold
        run: ./scripts/check-coverage.sh "${MIN_COVERAGE}" coverage.out
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./pkg/validation/, target: FuzzNormalizeMAC }
          - { pkg: ./internal/auth/, target: FuzzTokenParse }
          - { pkg: ./internal/auth/, target: FuzzVerifyPassword }
          - { pkg: ./internal/server/, target: FuzzEvaluateBody }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Fuzz ${{ matrix.target }}
        run: go test -run=NONE -fuzz=${{ matrix.target }} -fuzztime=60s ${{ matrix.pkg }}
      - name: Upload crashers on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: ${{ matrix.pkg }}/testdata/fuzz/
          if-no-files-found: ignore

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nac
          POSTGRES_PASSWORD: nac
          POSTGRES_DB: nac
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nac"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run integration tests
        env:
          NAC_TEST_DB_DSN: postgres://nac:nac@localhost:5432/nac?sslmode=disable
        run: go test -tags=integration ./test/integration/...

  build-image:
    name: Build image (CI)
    runs-on: ubuntu-latest
    needs: [verify, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: |
          docker build -f deployments/docker/Dockerfile \
            --build-arg VERSION="ci-${GITHUB_SHA::8}" \
            --build-arg COMMIT="${GITHUB_SHA::8}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t nac/nacd:ci .
